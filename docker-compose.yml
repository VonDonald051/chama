services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chama
      POSTGRES_USER: chama_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development-only POSTGRES_PASSWORD}
    command: ["postgres", "-c", "ssl=off"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chama_app -d chama"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [private]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [private]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set a development-only S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set a development-only S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks: [private]

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private, edge]

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    ports: ["3000:3000"]
    networks: [edge]

networks:
  private: { internal: true }
  edge: {}
volumes:
  postgres_data: {}
  redis_data: {}
  minio_data: {}
